<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FABL ROBLOX LEAGUE</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#050b18;
    color:white;
}

header{
    background:#071a35;
    border-bottom:2px solid #1769ff;
    padding:15px 20px;
    position:sticky;
    top:0;
    z-index:100;
}

.nav{
    max-width:1100px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    display:flex;
    align-items:center;
    gap:12px;
    font-size:22px;
    font-weight:bold;
}

.logo img{
    width:55px;
    height:55px;
    object-fit:cover;
    border-radius:50%;
}

nav a{
    color:white;
    text-decoration:none;
    margin-left:20px;
    font-weight:bold;
}

nav a:hover{
    color:#38a1ff;
}

.hero{
    text-align:center;
    padding:70px 20px;
    background:linear-gradient(180deg,#08245a,#050b18);
}

.hero img{
    width:150px;
    height:150px;
    object-fit:cover;
    border-radius:50%;
    box-shadow:0 0 35px #1268ff;
    margin-bottom:20px;
}

.hero h1{
    font-size:42px;
    margin-bottom:10px;
}

.hero p{
    color:#9db7df;
    font-size:18px;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:35px 20px;
}

.title{
    text-align:center;
    margin-bottom:25px;
}

.title h2{
    font-size:30px;
}

.title p{
    color:#8fa6c9;
    margin-top:8px;
}

.matches{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:20px;
}

.match{
    background:#0b1730;
    border:1px solid #173b70;
    border-radius:16px;
    padding:22px;
    text-align:center;
    transition:.2s;
}

.match:hover{
    transform:translateY(-5px);
    border-color:#2680ff;
    box-shadow:0 10px 30px #0008;
}

.date{
    color:#6eacff;
    font-size:14px;
    margin-bottom:15px;
}

.teams{
    font-size:24px;
    font-weight:bold;
    margin:15px 0;
}

.vs{
    color:#4c9aff;
    margin:0 8px;
}

.time{

    background:#1268ff;
    padding:9px 18px;
    border-radius:20px;
    font-weight:bold;
}

.status{
    margin-top:15px;
    color:#55e38a;
    font-size:14px;
}
